# Blitz.cloud Application Compose Configuration
# ASP.NET Core 8 Web API + PostgreSQL managed database
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: todolist-api
    ports:
      - "8080:8080"
    expose:
      - "8080"
    environment:
      ASPNETCORE_URLS: "http://+:8080"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_HTTPS_PORT: "443"
    volumes:
      # Persistent storage ensuring uploaded note images survive restarts and redeployments
      - todo_files:/app/wwwroot/files
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  todo_files:
    driver: local
